name: Deploy web

# Plan §9: prebuild the static export → SWA deploy with skip_app_build and
# api_location "" (linked-backend constraint). The deploy token is fetched at deploy
# time via `az staticwebapp secrets list` — never stored (§8 teardown table).
# staticwebapp.config.json lives at the package root, not in the export output, so
# it is copied in before upload. No skip_api_build: the action defines no such
# input (passing it warned on every run) — api_location "" already means no API
# build happens.

on:
  push:
    branches: [main, 'release/**']
    paths: ['apps/web/**', 'packages/shared/**']
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build --filter=@vidx/web

      - run: cp apps/web/staticwebapp.config.json apps/web/out/

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch SWA deployment token
        id: swa
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          NAME="$(az staticwebapp list --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[0].name' --output tsv)"
          if [[ -z "$NAME" ]]; then
            echo "::error::No static web app in $AZURE_RESOURCE_GROUP — run deploy-infra first."
            exit 1
          fi
          TOKEN="$(az staticwebapp secrets list --name "$NAME" \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: apps/web/out
          api_location: ''
          output_location: ''
          skip_app_build: true
