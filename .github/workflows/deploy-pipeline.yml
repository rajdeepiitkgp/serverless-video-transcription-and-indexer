name: Deploy pipeline

# Plan §9: bundle → Azure/functions-action, onto the Flex Consumption app (package
# lands in the identity-authenticated `deployments` container — no storage keys).
# The artifact must be symlink-free (node-linker=hoisted): pnpm deploy's default
# layout symlinks node_modules entries into node_modules/.pnpm, and those links do
# not survive the action's zip → server-side extract — the deploy reports success
# but the host loads zero functions (2026-08-13 incident, second Deploy all run).

on:
  push:
    branches: [main, 'release/**']
    paths: ['services/pipeline/**', 'packages/shared/**']
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-pipeline:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-pipeline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build --filter=@vidx/pipeline

      - name: Assemble deployable artifact
        run: >
          pnpm --filter @vidx/pipeline deploy --prod --config.node-linker=hoisted
          "$RUNNER_TEMP/pipeline-artifact"

      - name: Verify artifact is standalone
        run: scripts/verify-function-artifact.sh "$RUNNER_TEMP/pipeline-artifact"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve app name
        id: app
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          NAME="$(az functionapp list --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?contains(name, '-pipeline-')] | [0].name" --output tsv)"
          if [[ -z "$NAME" ]]; then
            echo "::error::No pipeline function app in $AZURE_RESOURCE_GROUP — run deploy-infra first."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: ${{ runner.temp }}/pipeline-artifact
          remote-build: false

      # The action reports success whether or not the host registers anything —
      # assert it did, so any future zero-functions cause fails here instead of
      # three jobs later in infra phase 2. Retries: the host needs a moment to
      # restart and index after the package swap.
      - name: Assert host registered functions
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          for _ in $(seq 1 40); do
            COUNT="$(az functionapp function list --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "${{ steps.app.outputs.name }}" \
              --query 'length(@)' --output tsv 2>/dev/null || echo 0)"
            if [[ "${COUNT:-0}" -gt 0 ]]; then
              echo "Host registered $COUNT function(s)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Host loaded zero functions after deploy (see the CLAUDE.md artifact gotcha)."
          exit 1
