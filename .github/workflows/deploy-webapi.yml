name: Deploy webapi

# Plan §9: bundle → Azure/functions-action. The artifact is assembled with
# `pnpm deploy` (materializes @vidx/shared and prod deps into a standalone folder)
# and shipped without remote build. It must be symlink-free (node-linker=hoisted):
# pnpm deploy's default layout symlinks node_modules entries into
# node_modules/.pnpm, and those links do not survive the action's zip →
# server-side extract — the deploy reports success but the host loads zero
# functions (2026-08-13 incident, second Deploy all run).

on:
  push:
    branches: [main, 'release/**']
    paths: ['services/webapi/**', 'packages/shared/**']
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-webapi:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-webapi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build --filter=@vidx/webapi

      - name: Assemble deployable artifact
        run: >
          pnpm --filter @vidx/webapi deploy --prod --config.node-linker=hoisted
          "$RUNNER_TEMP/webapi-artifact"

      - name: Verify artifact is standalone
        run: scripts/verify-function-artifact.sh "$RUNNER_TEMP/webapi-artifact"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve app name
        id: app
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          NAME="$(az functionapp list --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?contains(name, '-api-')] | [0].name" --output tsv)"
          if [[ -z "$NAME" ]]; then
            echo "::error::No webapi function app in $AZURE_RESOURCE_GROUP — run deploy-infra first."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: ${{ runner.temp }}/webapi-artifact
          remote-build: false

      # The action reports success whether or not the host registers anything —
      # assert it did, so any future zero-functions cause fails here instead of
      # surfacing later as SWA 502s. Retries: the host needs a moment to restart
      # and index after the package swap.
      - name: Assert host registered functions
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          for _ in 1 2 3 4 5 6; do
            COUNT="$(az functionapp function list --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "${{ steps.app.outputs.name }}" \
              --query 'length(@)' --output tsv 2>/dev/null || echo 0)"
            if [[ "${COUNT:-0}" -gt 0 ]]; then
              echo "Host registered $COUNT function(s)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Host loaded zero functions after deploy (see the CLAUDE.md artifact gotcha)."
          exit 1
