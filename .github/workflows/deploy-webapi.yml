name: Deploy webapi

# Plan §9: bundle → Azure/functions-action. The artifact is assembled with
# `pnpm deploy` (materializes @vidx/shared and prod deps into a standalone folder —
# the workspace symlinks never reach the zip) and shipped without remote build.

on:
  push:
    branches: [main, 'release/**']
    paths: ['services/webapi/**', 'packages/shared/**']
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-webapi:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-webapi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build --filter=@vidx/webapi

      - name: Assemble deployable artifact
        run: pnpm --filter @vidx/webapi deploy --prod "$RUNNER_TEMP/webapi-artifact"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve app name
        id: app
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          NAME="$(az functionapp list --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?contains(name, '-api-')] | [0].name" --output tsv)"
          if [[ -z "$NAME" ]]; then
            echo "::error::No webapi function app in $AZURE_RESOURCE_GROUP — run deploy-infra first."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: ${{ runner.temp }}/webapi-artifact
          remote-build: false
