name: AI review

# Plan §9 as amended by ADR-0004: AI review is opt-in — each run spends Anthropic
# API credits, so nothing reviews automatically by default. Add the `ai-review`
# label to a same-repo PR to have every push reviewed while the label stays on,
# or comment `@claude` (maintainers only; the only path for fork PRs — never
# pull_request_target automation, fork code must not run with secrets).
# ANTHROPIC_API_KEY lives in the `production` environment.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  auto-review:
    # Runs only while the PR carries the `ai-review` label; the last clause stops
    # unrelated `labeled` events from triggering duplicate reviews.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            Review this pull request as a strict but pragmatic senior engineer.
            The repo's contract is IMPLEMENTATION_PLAN.md; conventions live in
            CLAUDE.md, docs/style-guide.md, and docs/testing-principles.md. Focus on
            (1) real bugs and unhandled failure paths, (2) violations of the style
            guide, the ports-and-adapters boundaries, or the zero-secret rules, and
            (3) missing or misplaced tests (tests live in tests/ trees, never src/).
            Post concise inline comments on the specific lines; skip nitpicks
            prettier/eslint already enforce. Finish with a one-paragraph summary
            comment on the PR.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
