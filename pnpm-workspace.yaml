packages:
  - apps/*
  - services/*
  - packages/*

# Neither dependency needs its install script: keytar (via SWA CLI) only backs
# `swa login` credential storage, and vue-demi's postinstall merely swaps in Vue-2
# entry files — Scalar runs on the shipped Vue-3 defaults.
allowBuilds:
  keytar: false
  vue-demi: false

engineStrict: true

# Workspace deps are hard-linked copies, not symlinks — required by `pnpm deploy`
# (pnpm >=10), which assembles the standalone function-app artifacts in the deploy
# workflows. Caveat: after adding a NEW file to packages/shared, run `pnpm install`
# so consumers' injected copies pick it up (in-place rebuilds propagate on their own).
injectWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@testing-library/user-event@14.6.4'

# uuid <14 is flagged by GHSA-w5hq-g745-h8pq and only reachable via
# azurite -> @azure/ms-rest-js / sequelize, which pin uuid@^8 (dev-only).
# Safe on Node 24 (require(esm)); drop when azurite's deps move to uuid >=14.
#
# adm-zip <0.6 (GHSA-xcpc-8h2w-3j85) and tmp <0.2.6 (GHSA-ph9p-34f9-6g65,
# GHSA-52f5-9888-hmc6) are dev-only, reachable solely via
# @azure/static-web-apps-cli (adm-zip directly, tmp via devcert); Dependabot
# can't bump them there (pinned transitively), so they're forced here like uuid.
# Drop each when the SWA CLI's dependency tree moves past the patched versions.
overrides:
  uuid: ^14.0.1
  adm-zip: ^0.6.0
  tmp: ^0.2.7
