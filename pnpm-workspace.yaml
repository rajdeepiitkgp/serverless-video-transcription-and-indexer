packages:
  - apps/*
  - services/*
  - packages/*

# Neither dependency needs its install script: keytar (via SWA CLI) only backs
# `swa login` credential storage, and vue-demi's postinstall merely swaps in Vue-2
# entry files — Scalar runs on the shipped Vue-3 defaults.
allowBuilds:
  keytar: false
  vue-demi: false

engineStrict: true

minimumReleaseAgeExclude:
  - '@testing-library/user-event@14.6.4'

# uuid <14 is flagged by GHSA-w5hq-g745-h8pq and only reachable via
# azurite -> @azure/ms-rest-js / sequelize, which pin uuid@^8 (dev-only).
# Safe on Node 24 (require(esm)); drop when azurite's deps move to uuid >=14.
overrides:
  uuid: ^14.0.1
